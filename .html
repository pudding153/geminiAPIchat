<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">
    <button class="undo-button" onclick="undoChat()">1往復削除</button>
    <button class="clear-button" onclick="clearChat()">全削除</button>
  </div>
  <div id="log"></div>
  <textarea id="input" maxlength="400" placeholder="Enter2回で送信 / 改行はEnter1回"></textarea>
  <button id="send-button" onclick="send()">送信</button>
  <script src="script.js"></script>
</body>
</html>
